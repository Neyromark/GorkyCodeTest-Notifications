services:
  notifications:
    build: .
    restart: unless-stopped
    # БД — сервис postgres (container_name tasks_postgres_db) из подмодуля Database
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    # Значения ниже имеют приоритет над .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-tasks_db}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://vkbottle_bot/api/v1/send-message}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      TIMEZONE: ${TIMEZONE:-UTC}
    ports:
      - "${APP_PORT:-8000}:8080"
    networks:
      - app-network
